[project]
name = "lecturecut"
version = "0.1.0"
description = "Python + FFmpeg lecture cleanup pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only the web UI needs these; the CLI stays dependency-free.
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
lecturecut = "main:main"
lecturecut-web = "webui:serve"

[tool.setuptools]
py-modules = ["main", "webui"]
